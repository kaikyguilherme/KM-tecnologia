<!doctype html>
<!-- Lista de serviços técnicos que podem ser adicionados ao carrinho. -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serviços | KM Tecnologia</title>
  <link rel="stylesheet" href="principal.css">
  <link rel="stylesheet" href="servicos.css">
  <script src="site.js" defer></script>
  <script src="servicos.js" defer></script>
</head>
<body data-pagina="servicos">
  <!-- Cabeçalho comum criado pelo site.js. -->

    <span class="rotulo">Assistência especializada</span>
    <h1 class="titulo-secao">Serviços para manter tudo <span class="destaque">em ordem.</span></h1>

    <!-- Cartões de serviço e opções são montados pelo arquivo servicos.js. -->
    <section class="grade grade-produtos" id="lista-servicos" aria-label="Serviços disponíveis"></section>
  </main>
  <footer data-rodape></footer>

</html>
